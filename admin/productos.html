<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de administración de ChileGol Store.">
  <title>Productos · Panel ChileGol</title>
  <link rel="icon" href="../imagenes/logo-cgs.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/formularios.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <script src="../scripts/datos.js" defer></script>
  <script src="../scripts/validaciones.js" defer></script>
  <script src="../scripts/carrito.js" defer></script>
  <script src="../scripts/productos.js" defer></script>
  <script src="../scripts/principal.js" defer></script>
  <script src="../scripts/admin.js" defer></script>
</head>
<body data-raiz="../" class="es-admin">
  <a class="salto-contenido" href="#contenido">Ir al contenido principal</a>
  <div class="panel">
    <aside class="lateral">
      <a class="lateral__marca" href="../index.html">
        <img src="../imagenes/logo-cgs.svg" alt="" width="32" height="32">
        <span>ChileGol admin</span>
      </a>
      <nav aria-label="Módulos de administración">
        <ul class="lateral__menu">
            <li><a href="index.html">Resumen</a></li>
            <li data-requiere="productos"><a href="productos.html" aria-current="page">Productos</a></li>
            <li data-requiere="ordenes"><a href="ordenes.html">Órdenes</a></li>
            <li data-requiere="usuarios"><a href="usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
      <div class="lateral__sesion">
        <p><span data-sesion-nombre>Invitado</span></p>
        <p><span class="lateral__rol" data-sesion-rol>—</span></p>
        <a href="../index.html">Ver la tienda</a>
        <a href="#" data-salir>Cerrar sesión</a>
      </div>
    </aside>

    <main class="trabajo" id="contenido">
      <div class="trabajo__cabecera">
        <h1>Productos</h1>
        <a class="boton boton--principal" href="producto-form.html" data-solo-admin>Nuevo producto</a>
      </div>

      <p class="aviso" data-anuncio hidden role="status"></p>

      <div class="buscador">
        <div class="campo">
          <label for="buscar">Buscar por nombre o código</label>
          <input id="buscar" name="buscar" type="search" autocomplete="off">
        </div>
      </div>

      <div class="tabla-envoltorio">
        <table class="tabla">
          <caption>Listado de productos del catálogo</caption>
          <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Categoría</th>
              <th scope="col">Precio</th>
              <th scope="col">Stock</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody data-tabla-productos></tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
